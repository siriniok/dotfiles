[ids]
*

[main]
# Caps Lock is the actual Control modifier ("Ctrl" in the shortcuts below).
capslock = layer(control)
# Physical left Ctrl emits Scroll Lock, reserved for XKB's direct EN/UK toggle.
# This avoids GNOME's modal layout popup; Shift also toggles these two layouts.
leftcontrol = scrolllock
# Left Super is Command; explicit bindings translate it to GNOME shortcuts.
leftmeta = layer(cmd)
# Right Super also acts as Command.
rightmeta = layer(cmd)
# Right Ctrl emits Compose; XKB's compose:menu starts character sequences.
rightcontrol = compose
# Left Alt is Option; unlisted combinations retain normal Alt behavior.
leftalt = layer(opt)
# Right Alt is AltGr: hold for third-level characters, add Shift for fourth.
rightalt = layer(altgr)

[shift]
# Shift+left Ctrl also toggles EN/UK; omit Shift from the XKB switch signal.
leftcontrol = scrolllock

[opt:A]
# Option+Left moves backward one word.
left = C-left
# Option+Right moves forward one word.
right = C-right
# Option+Up moves to the previous paragraph.
up = C-up
# Option+Down moves to the next paragraph.
down = C-down
# Option+Backspace deletes the previous word.
backspace = C-backspace
# Option+Delete deletes the next word.
delete = C-delete
[cmd]
# Command+E opens Ghostty through the GNOME custom shortcut.
e = M-e
# Command+Enter opens Files through the GNOME custom shortcut.
enter = M-enter
# Command+Space opens GNOME overview/search (configured by Home Manager).
space = M-space
# Command+Tab switches applications; adding Shift switches backward.
tab = M-tab
# Command+grave switches windows of this application; Shift reverses it.
` = A-f6
# Command+F3 shows the desktop; repeat to restore the windows.
f3 = M-d
# Command+M minimizes the focused window.
m = M-m
# Command+H also minimizes this window (GNOME has no macOS hide-app action).
h = M-m
# Command+Q asks the application to quit through its normal Ctrl+Q shortcut.
q = C-q
# Command+W closes the current tab/document through Ctrl+W.
w = C-w
# Command+S saves the current document.
s = C-s
# Command+F searches within the current application.
f = C-f
# Command+N requests a new window/document.
n = C-n
# Command+T requests a new tab in applications that support tabs.
t = C-t
# Command+P opens the application's print dialog.
p = C-p
# Command+Left moves to the beginning of the line.
left = home
# Command+Right moves to the end of the line.
right = end
# Command+Up moves to the beginning of the document.
up = C-home
# Command+Down moves to the end of the document.
down = C-end
# Command+A selects all.
a = C-a
# Command+C copies the selection.
c = C-c
# Command+V pastes from the clipboard.
v = C-v
# Command+X cuts the selection.
x = C-x
# Command+Z undoes the last edit.
z = C-z
# Command+1 selects application tab 1 (rather than GNOME's dock item 1).
1 = A-1
# Command+2 selects application tab 2.
2 = A-2
# Command+3 selects application tab 3.
3 = A-3
# Command+4 selects application tab 4.
4 = A-4
# Command+5 selects application tab 5.
5 = A-5
# Command+6 selects application tab 6.
6 = A-6
# Command+7 selects application tab 7.
7 = A-7
# Command+8 selects application tab 8.
8 = A-8
# Command+9 selects application tab 9.
9 = A-9

[control]
# Ctrl+Up (physical Caps Lock+Up) opens overview, like Mission Control.
up = M-f3
# Ctrl+Down opens GNOME's application grid (not macOS App Expose).
down = M-f4
# Ctrl+Left moves to the workspace on the left; add Shift to move this window.
left = C-M-left
# Ctrl+Right moves to the workspace on the right; add Shift to move this window.
right = C-M-right

[cmd+control]
# Ctrl+Command+Q locks the session; it does not log out or stop GDM.
q = M-l
# Ctrl+Command+F toggles fullscreen for the focused window.
f = C-M-f

[cmd+opt]
# Command+Option+D shows/restores the desktop, like macOS's Dock shortcut.
d = M-d
# Command+Option+Escape opens System Monitor; it never kills a process itself.
esc = C-S-esc

[opt+shift]
# Option+Shift+Left selects the previous word.
left = S-C-left
# Option+Shift+Right selects the next word.
right = S-C-right

[cmd+shift]
# Command+Shift+Left selects to the beginning of the line.
left = S-home
# Command+Shift+Right selects to the end of the line.
right = S-end
# Command+Shift+Up selects to the beginning of the document.
up = S-C-home
# Command+Shift+Down selects to the end of the document.
down = S-C-end
# Command+Shift+Z redoes the last edit in applications using Ctrl+Shift+Z.
z = C-S-z
# Command+Shift+3 captures the whole screen using GNOME Shell.
3 = S-M-3
# Command+Shift+4 opens GNOME's area/window/screen screenshot selector.
4 = S-M-4
# Command+Shift+5 opens the same selector, which also offers screen recording.
5 = S-M-5
